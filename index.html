<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASTEROIDS: DEEP SPACE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="space" aria-label="Asteroids space combat arena"></canvas>
  <div class="vignette"></div>
  <header><div class="brand">◈ <span>AEGIS <small>FLIGHT SYSTEMS</small></span></div></header>

  <main id="menu" class="panel">
    <h1>ASTEROIDS<span>DEEP SPACE</span></h1>
    <div class="menu-actions">
      <button id="tutorial" class="primary">Tutorial</button>
      <button id="play" class="primary" aria-describedby="playHint">Play</button>
      <p id="playHint" class="hint">Complete Tutorial to unlock Endless.</p>
      <button id="settings" class="quiet">Settings</button>
    </div>
  </main>

  <div id="hud" hidden>
    <div><label>SCORE</label><strong id="score">000000</strong></div>
    <div id="bestStat"><label>PERSONAL BEST</label><b id="best">000000</b></div>
    <div class="hull"><label>⬡ HULL <span id="hullCount"></span></label><div id="health"></div></div>
    <div><label>◈ WAVE</label><b id="wave">01</b></div>
    <div><label>◇ FLEET</label><b id="fleetCount">0</b></div>
    <button id="pause" class="quiet" aria-label="Pause">Ⅱ</button>
  </div>
  <div id="flightProgress" hidden>
    <div class="progress-row"><label for="experience" id="level">LEVEL 1</label><span id="xpCount"></span></div>
    <progress id="experience" max="8" value="0"></progress>
    <span id="gadgetStatus"></span><progress id="missileCooldown" aria-label="Missile reload" max="9" value="9"></progress>
  </div>
  <div id="boss" hidden>
    <label for="bossHealth">CARRIER</label>
    <progress id="bossHealth" max="60" value="60"></progress>
  </div>
  <aside id="lesson" hidden>
    <div id="lessonStep" class="eyebrow"></div>
    <div class="key-diagram" aria-hidden="true"><kbd>W</kbd><br><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · ◉ FIRE</div>
    <p id="lessonText" aria-live="polite"></p>
    <details id="droneGuide" hidden>
      <summary>Drone field guide</summary>
      <dl id="droneManual"></dl>
    </details>
  </aside>

  <section id="overlay" class="modal" aria-labelledby="overlayTitle" role="dialog" aria-modal="true" hidden>
    <h2 id="overlayTitle"></h2>
    <p id="overlayText"></p>
    <div id="stats"></div>
    <button id="resume" class="primary">Resume</button>
    <button id="restart" class="primary">Try again</button>
    <button id="launchEndless" class="primary">Play Endless</button>
    <button id="home" class="quiet">Main menu</button>
  </section>

  <section id="reward" class="modal" aria-labelledby="rewardTitle" role="dialog" aria-modal="true" hidden>
    <div id="rewardLevel" class="eyebrow"></div>
    <h2 id="rewardTitle">Choose one reward</h2>
    <div id="rewardCards"></div>
  </section>

  <section id="settingsPanel" class="modal" aria-labelledby="settingsTitle" role="dialog" aria-modal="true" hidden>
    <h2 id="settingsTitle">Settings</h2>
    <p>WASD moves independently. Hold Fire to aim at the pointer. Escape pauses.</p>
    <div id="bindings"></div>
    <p id="bindingHint" class="hint" aria-live="polite"></p>
    <button id="resetBindings" class="quiet">Reset controls</button>
    <button id="mute" class="quiet" aria-label="Toggle audio">Sound on</button>
    <button id="closeSettings" class="primary">Back</button>
  </section>

  <div id="announcement" aria-live="polite"></div>
  <script src="js/background.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/bullet.js"></script>
  <script src="js/player.js"></script>
  <script src="js/asteroid.js"></script>
  <script src="js/config.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
